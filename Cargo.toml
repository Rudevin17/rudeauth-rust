[package]
name = "rudeauth"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Client SDK for a RudeAuth licensing server: responses are verified against a pinned Ed25519 key before any field is trusted"
repository = "https://github.com/Rudevin17/rudeauth-rust"
readme = "README.md"
keywords = ["licensing", "authentication", "ed25519", "drm"]
categories = ["authentication", "api-bindings"]

[dependencies]
ed25519-dalek = "2"
x25519-dalek = "2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tiny_http = "0.12"
